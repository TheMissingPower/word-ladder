_ > nanoagent.plugin.v0001.ManifestConfig:
id: word-ladder
name: Word Ladder
version: 0.2.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  is_word:
    description: Tell whether a word is in the puzzle dictionary, the 4-letter words of the ENABLE word list
  pin_puzzle:
    description: Pin a frozen puzzle's answer key, whether it has a ladder and the number of words in a shortest one

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  solve-ladder:
    description: Find a shortest word ladder between two 4-letter words, or report that none exists
    runner: agent
    tools: [is_word]
    reference: pin_puzzle
    instructions: |-
      Find the shortest ladder from the start word to the end word, changing one letter per step, or report that no ladder exists.
      Rules:
      - All words are lowercase ASCII letters.
      - Each consecutive pair of words differs in exactly one position.
      - No letters are added, removed, or rearranged.
      - Every word, including start and end, must be in the dictionary.
      - No word may repeat.
      - The ladder includes both the start word and the end word.
      - The ladder must be as short as possible.
      - If no ladder exists, say so instead of giving one.
      The dictionary is the 4-letter words of the ENABLE word list. Check any word you are unsure of with is_word: it is the only authority on what is a word. ENABLE holds many uncommon words, so a word you do not know may still be in it.
      Submit solvable true and the ladder, start first and end last; or solvable false and an empty ladder.
